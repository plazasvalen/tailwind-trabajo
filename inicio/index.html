<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>

<body class="">

    <section class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
        <div
            class="w-full max-w-md bg-slate-900/70 backdrop-blur-xl border border-slate-500/30 rounded-2xl p-8 shadow-2xl shadow-slate-300/20">
            <form class="space-y-5">

                <h1 id="inicio_de_sesion" class="font-bold text-2xl mb-10 mt-3 text-white ">Inicio de Sesion</h1>

                <!-- Campo Correo -->
                <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
                    Correo Electrónico
                </label>
                <input type="email" placeholder="correo@gmail.com"
                    class="w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20">
                <!-- Campo Contraseña -->
                <div>

                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-semibold text-slate-300 uppercase tracking-wider">
                            Contraseña
                        </label>

<a href="#" id="abrirModal" class="text-xs text-cyan-400 hover:text-cyan-300 transition-colors">¿Olvidaste clave?</a>

  <div id="miModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
    <div class="bg-slate-900 rounded-xl shadow-lg w-full max-w-sm p-6 relative ">
      <button id="cerrarModal" class="absolute top-2 right-3 text-white text-xl">&times;</button>
      <h2 class="text-white text-2xl font-bold font-lg font-2xl mb-2">Recuperar clave</h2>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-6">
                    Correo Electrónico
                </label>
                <input type="email" placeholder="correo@gmail.com"
                    class="-ml-1 w-full bg-slate-950/80 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all duration-200">

                <h2 class="text-white text-lg font-semibold mb-2 mt-4">Ingresar</h2>
<form id="formClave" class="space-y-3">
  <input id="inputClave" type="password" placeholder="Escribe tu clave"
    class="-ml-1 w-full bg-slate-950/80 border border-red-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all duration-200">
  <button id="btnEnviar" type="submit"
    class="w-full bg-slate-300/70 hover:bg-slate-700 hover:shadow-slate-300 text-white text-sm py-2 rounded-lg disabled:opacity-50 mt-6">Entrar</button>
  <p id="mensaje" class="text-sm text-slate-300"></p>
</form>

<script>
  const modal = document.getElementById('miModal');
  const abrir = document.getElementById('abrirModal');
  const cerrar = document.getElementById('cerrarModal');
  const contenido = modal.firstElementChild;

  abrir.addEventListener('click', (e) => {
    e.preventDefault();
    e.stopPropagation();
    modal.classList.remove('hidden');
  });

  cerrar.addEventListener('click', () => modal.classList.add('hidden'));

  // Clic dentro del contenido: no cierra
  contenido.addEventListener('click', (e) => e.stopPropagation());

  // Clic en cualquier otro lado: cierra
  document.addEventListener('click', () => modal.classList.add('hidden'));

  const claveOk = "secreto";
  const form = document.getElementById('formClave');
  const input = document.getElementById('inputClave');
  const mensaje = document.getElementById('mensaje');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    if (input.value === claveOk) {
      mensaje.textContent = "Bienvenido";
    } else {
      mensaje.textContent = "Clave incorrecta";
    }
  });
</script>

    </div>
  </div>

                    </div>
                    <input type="password" placeholder="••••••••••••"
                        class="w-full bg-slate-950/80 hover:bg-slate-600 border border-slate-700/80 rounded-xl px-4 py-3 text-white placeholder-slate-500 text-sm focus:outline-none focus:border-cyan-400 focus:ring-2 focus:ring-cyan-400/20 transition-all duration-200">
                </div>

                <div>
                <a href="../index.html"
                    class="text-center w-full bg-slate-400 hover:bg-slate-600 text-slate-950 font-bold py-3.5 px-4 py-3 rounded-xl shadow-lg hover:shadow-slate-400/20 hover:-translate-y-0.5 active:translate-y-0 transition duration-200 grid grid-flow-col mt-4 hover hover:animate-pulse">
                    Iniciar Sesion
                </a>
                </div>

                <div class="mt-4 hover:shadow-cyan-400/40 hover:-translate-y-0.5 active:translate-y-0 transition duration-150 ease-in-out">
                <a href="../index.html"
                    class="p-1 text-center bg-slate-400 hover:bg-slate-700 text-slate-950 font-bold px-4 rounded-xl shadow-lg hover hover:shadow-slate-400/20">
                    Atrás
                </a>
                </div>

            </form>
        </div>
    </section>


</body>
</html>
